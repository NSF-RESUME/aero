services:
  web:
    build:
      dockerfile: ./Dockerfiles/Dockerfile.server.dev

    # ports:
    #  - "8000:80"

    env_file:
      - scripts/setup_env.sh

    # expose:
    #  - 8081

    command: "uvicorn aero.main:app --host 0.0.0.0  --port 8081"
    # --host 0.0.0.0  --port 8081 --proxy-headers --forwarded-allow-ips *"
    # --ssl-keyfile=/keys/cels.anl.gov-key.pem --ssl-certfile=/certs/cels-incommon.anl.gov-bundle.pem"
    # --proxy-headers --uds /var/sockets/uvicorn.sock"

    volumes:
      - ./aero:/app/aero
      - ./data:/app/aero/data
      # - /etc/pki/tls/private:/keys
      # - /etc/pki/tls/certs:/certs
    depends_on:
      - database

  nginx:
    image: nginx
    ports:
      - "80:80"
      - "443:443"

    volumes:
      - /etc/pki/tls/private:/keys
      - /etc/pki/tls/certs:/certs
      - ./nginx/aero-app.conf:/etc/nginx/conf.d/aero-app.conf

    depends_on:
       - web

  database:
    restart: always
    image: postgres:17.4
    env_file:
      - scripts/setup_env.sh
    ports:
      - "5432:5432"
    volumes:
      - osprey-postgres-data:/var/lib/postgresql/data
  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080
volumes:
  osprey-postgres-data:
    external: true
