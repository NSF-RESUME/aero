# AERO front-door reverse proxy.
#
# Single hostname, path-based routing to multiple AERO instances:
#   https://aero.cels.anl.gov/aero1/...  -> aero1 stack (web alias: aero1-web)
#   https://aero.cels.anl.gov/aero2/...  -> aero2 stack (web alias: aero2-web)
#
# Each instance's uvicorn MUST run with a matching --root-path (/aero1, /aero2)
# so FastAPI emits correctly-prefixed URLs (Swagger UI at /aeroN/docs, openapi
# at /aeroN/openapi.json). See the web service command / ROOT_PATH_ARG in
# docker-compose.yml.
#
# Only ONE nginx runs this config (the front door). Its container must be able
# to resolve aero1-web / aero2-web -- attach it and the web services to the
# shared "aero-shared" docker network (see docs/running-multiple-instances.md).

# Docker's embedded DNS. Using a resolver + variable upstream lets nginx START
# even when a backend isn't up yet (it 502s at request time instead of failing
# to load the config), which keeps the front door resilient to a stack restart.
resolver 127.0.0.11 valid=30s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    # listen 443 ssl;                       # enable for TLS, then uncomment certs:
    # ssl_certificate     /certs/cels-incommon.anl.gov-bundle.pem;
    # ssl_certificate_key /keys/cels.anl.gov-key.pem;
    server_name aero.cels.anl.gov;

    # --- instance 1 --------------------------------------------------------
    location = /aero1 { return 308 /aero1/; }
    location /aero1/ {
        set $aero1_web http://aero1-web:8081;
        rewrite ^/aero1/(.*)$ /$1 break;    # strip the /aero1 prefix for the app
        proxy_pass $aero1_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /aero1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_cache_bypass $http_upgrade;
    }

    # --- instance 2 --------------------------------------------------------
    location = /aero2 { return 308 /aero2/; }
    location /aero2/ {
        set $aero2_web http://aero2-web:8081;
        rewrite ^/aero2/(.*)$ /$1 break;
        proxy_pass $aero2_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /aero2;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_cache_bypass $http_upgrade;
    }
}
